<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ShelfScout</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#172033}.header{background:#172033;color:#fff;padding:20px;text-align:center}.logo{font-size:30px;font-weight:800}.tagline{opacity:.75;font-size:14px}.container{max-width:700px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 15px #0000000f}h2{margin-top:0}input{width:100%;padding:14px;border:1px solid #d7dce5;border-radius:12px;font-size:16px;margin-bottom:10px}button{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}.scan{background:#16a34a;font-size:19px}.ai{background:#7c3aed;font-size:18px;margin-top:10px}.stop{background:#dc2626;margin-top:10px}.wanted-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.remove{width:auto;padding:7px 10px;background:#ef4444;font-size:13px}.empty{text-align:center;color:#777;padding:10px}.status{text-align:center;font-weight:700;margin-top:15px}.small{font-size:13px;color:#667085;line-height:1.45}.scanner{display:none;position:relative;background:#000;border-radius:16px;overflow:hidden;margin-top:15px}.scanner video{display:block;width:100%;height:auto;min-height:380px;object-fit:cover}.scanBox{position:absolute;left:5%;right:5%;top:25%;height:50%;border:3px solid #22c55e;border-radius:14px;box-shadow:0 0 0 9999px #0000002b;pointer-events:none}.scanHint{position:absolute;top:10px;left:0;right:0;text-align:center;color:white;font-weight:700;text-shadow:0 1px 3px #000}.result{display:none;margin-top:14px;padding:16px;border-radius:14px;font-weight:800;font-size:18px}.wanted{background:#dcfce7;color:#166534}.possible{background:#fef3c7;color:#92400e}.found{text-align:center;margin-top:8px;font-size:14px}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#e5e7eb;font-size:12px;margin-left:6px}.mode{display:flex;gap:8px;margin-bottom:12px}.mode button{background:#e5e7eb;color:#334155;padding:10px}.mode .active{background:#2563eb;color:#fff}.aiItem{padding:10px 0;border-bottom:1px solid #eee}.buy{color:#166534;font-weight:800}</style></head><body><div class="header"><div class="logo">📚 ShelfScout</div><div class="tagline">Find what you're hunting for.</div></div><div class="container"><div class="card"><h2>🔎 Add to your Wanted List</h2><input id="itemInput" placeholder="Book, VHS, CD, DVD or movie title..."><button onclick="addItem()">Add Item</button></div><div class="card"><h2>📋 Wanted Items</h2><div id="wantedList"></div></div><div class="card"><h2>📷 Shelf Scanner</h2><p class="small">Fast local scanner for continuous shelf sweeps. For the real multi-spine AI test, use AI Shelf Scan below.</p><div class="mode"><button id="allBtn" class="active" onclick="setMode('all')">All</button><button id="bookBtn" onclick="setMode('books')">Books</button><button id="mediaBtn" onclick="setMode('media')">VHS / CD / DVD</button></div><button class="scan" onclick="startScan()">Scan Shelf</button><button class="ai" onclick="startAIScan()">🤖 AI Scan Whole Shelf</button><div id="scanner" class="scanner"><video id="video" playsinline muted></video><div class="scanHint">Sweep across the shelf →</div><div class="scanBox"></div></div><button id="captureBtn" class="ai" style="display:none" onclick="captureShelf()">📸 Analyze This Shelf</button><button id="stopBtn" class="stop" style="display:none" onclick="stopScan()">Stop Scanning</button><div id="status" class="status"></div><div id="result" class="result"></div><div id="found" class="found"></div><div id="aiResults"></div></div></div><script>
let wantedItems=JSON.parse(localStorage.getItem('shelfscoutWanted'))||[];let scanMode='all',stream=null,scanning=false,ocrBusy=false,lastMatch='',lastMatchAt=0;
const $=id=>document.getElementById(id);function save(){localStorage.setItem('shelfscoutWanted',JSON.stringify(wantedItems))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addItem(){let v=$('itemInput').value.trim();if(!v)return;if(!wantedItems.some(x=>x.toLowerCase()===v.toLowerCase()))wantedItems.push(v);save();$('itemInput').value='';render()}function removeItem(i){wantedItems.splice(i,1);save();render()}function render(){let l=$('wantedList');if(!wantedItems.length){l.innerHTML='<div class="empty">Your wanted list is empty.</div>';return}l.innerHTML=wantedItems.map((x,i)=>`<div class="wanted-item"><span>📖 ${esc(x)}</span><button class="remove" onclick="removeItem(${i})">Remove</button></div>`).join('')}
function setMode(m){scanMode=m;document.querySelectorAll('.mode button').forEach(x=>x.classList.remove('active'));$(m==='all'?'allBtn':m==='books'?'bookBtn':'mediaBtn').classList.add('active')}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}function sim(a,b){a=norm(a);b=norm(b);if(a.includes(b)||b.includes(a))return .96;let A=new Set(a.split(' ').filter(x=>x.length>2)),B=new Set(b.split(' ').filter(x=>x.length>2));let n=0;A.forEach(x=>{if(B.has(x))n++});return n/Math.max(A.size,B.size,1)}function findMatch(text){let best=null,score=0;for(const item of wantedItems){let s=sim(text,item);if(s>score){score=s;best=item}}return score>=.68?{item:best,score}:null}function haptic(){navigator.vibrate?.([90,45,90,45,180])}function showWanted(item,confidence){let now=Date.now();if(item===lastMatch&&now-lastMatchAt<3500)return;lastMatch=item;lastMatchAt=now;$('result').className='result wanted';$('result').style.display='block';$('result').textContent='🎯 WANTED!';$('found').innerHTML=`<b>${esc(item)}</b><span class="badge">${Math.round(confidence*100)}% match</span>`;haptic()}
async function startScan(){if(!wantedItems.length){$('status').textContent='Add a wanted item first.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('video').srcObject=stream;await $('video').play();scanning=true;$('scanner').style.display='block';$('stopBtn').style.display='block';$('captureBtn').style.display='none';$('status').textContent='📷 Live scanning — sweep across the shelf';}catch(e){$('status').textContent='Camera permission was blocked. Allow camera access and try again.'}}
function stopScan(){scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('scanner').style.display='none';$('stopBtn').style.display='none';$('captureBtn').style.display='none';$('result').style.display='none';$('status').textContent='Scanner stopped.'}
async function startAIScan(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;await $('video').play();$('scanner').style.display='block';$('stopBtn').style.display='block';$('captureBtn').style.display='block';$('status').textContent='🤖 AI mode: frame the whole shelf, then tap Analyze This Shelf.';$('aiResults').innerHTML=''}catch(e){$('status').textContent='Camera permission was blocked.'}}
async function captureShelf(){let v=$('video');if(!v.videoWidth)return;$('status').textContent='🤖 AI is reading the shelf…';$('captureBtn').disabled=true;let c=document.createElement('canvas');let max=1400,scale=Math.min(1,max/v.videoWidth);c.width=Math.floor(v.videoWidth*scale);c.height=Math.floor(v.videoHeight*scale);c.getContext('2d').drawImage(v,0,0,c.width,c.height);let image=c.toDataURL('image/jpeg',.78);try{let r=await fetch('/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,wantedItems,mode:scanMode})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Recognition failed');renderAI(d.items||[]);$('status').textContent=`🤖 Found ${d.items?.length||0} item(s).`; }catch(e){$('status').textContent='AI scan unavailable: '+e.message}finally{$('captureBtn').disabled=false}}
function renderAI(items){$('aiResults').innerHTML=items.length?'<h3>AI Shelf Results</h3>'+items.map(x=>{let wanted=x.wantedMatch;return `<div class="aiItem">${wanted?'<span class="buy">🎯 WANTED</span> ':''}<b>${esc(x.title||'Unknown')}</b> ${x.author?'— '+esc(x.author):''}<span class="badge">${Math.round((x.confidence||0)*100)}%</span><br><small>${esc(x.mediaType||'unknown')}</small></div>`}).join(''):'<div class="empty">No confident items found. Try moving closer or improving lighting.</div>';let hit=items.find(x=>x.wantedMatch);if(hit)showWanted(hit.wantedMatch,hit.confidence||.8)}
render();
</script></body></html>
