<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelfScout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    .header {
      background: #172033;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
    }

    .tagline {
      margin-top: 5px;
      opacity: 0.75;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7dce5;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    .scan {
      background: #16a34a;
      font-size: 19px;
      padding: 18px;
    }

    .wanted-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .wanted-item:last-child {
      border-bottom: 0;
    }

    .remove {
      width: auto;
      padding: 7px 10px;
      background: #ef4444;
      font-size: 13px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 10px;
    }

    .status {
      text-align: center;
      font-weight: 700;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">📚 ShelfScout</div>
    <div class="tagline">Find what you're hunting for.</div>
  </div>

  <div class="container">

    <div class="card">
      <h2>🔎 Add to your Wanted List</h2>

      <input
        id="itemInput"
        type="text"
        placeholder="Book or movie title..."
      >

      <button onclick="addItem()">
        Add Item
      </button>
    </div>

    <div class="card">
      <h2>📋 Wanted Items</h2>

      <div id="wantedList">
        <div class="empty">
          Your wanted list is empty.
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📷 Shelf Scanner</h2>

      <p>
        Scan a shelf and ShelfScout will look for items on your wanted list.
      </p>

      <button class="scan" onclick="startScan()">
        Scan Shelf
      </button>

      <div id="status" class="status"></div>
    </div>

  </div>

<script>

  let wantedItems =
    JSON.parse(localStorage.getItem("shelfscoutWanted")) || [];

  function saveItems() {
    localStorage.setItem(
      "shelfscoutWanted",
      JSON.stringify(wantedItems)
    );
  }

  function addItem() {

    const input = document.getElementById("itemInput");
    const title = input.value.trim();

    if (!title) return;

    wantedItems.push(title);

    saveItems();

    input.value = "";

    renderList();
  }

  function removeItem(index) {

    wantedItems.splice(index, 1);

    saveItems();

    renderList();
  }

  function renderList() {

    const list = document.getElementById("wantedList");

    if (wantedItems.length === 0) {

      list.innerHTML =
        '<div class="empty">Your wanted list is empty.</div>';

      return;
    }

    list.innerHTML = "";

    wantedItems.forEach((item, index) => {

      const row = document.createElement("div");

      row.className = "wanted-item";

      row.innerHTML = `
        <span>📖 ${item}</span>
        <button class="remove"
          onclick="removeItem(${index})">
          Remove
        </button>
      `;

      list.appendChild(row);
    });
  }

  function startScan() {

    const status =
      document.getElementById("status");

    status.textContent =
      "📷 Scanner coming next...";

  }

  renderList();

</script>

</body>
</html>
